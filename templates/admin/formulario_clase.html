<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clase | LMS UPQ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body{background:#f4f7fb;font-family:Arial,Helvetica,sans-serif}.layout{display:flex;min-height:100vh}.sidebar{width:280px;background:linear-gradient(180deg,#063c78,#0b5cad);color:white;position:fixed;top:0;bottom:0;left:0;padding:24px 18px;display:flex;flex-direction:column}.brand{display:flex;gap:12px;align-items:center;margin-bottom:30px}.brand-icon{width:48px;height:48px;background:white;color:#0b5cad;border-radius:14px;display:grid;place-items:center;font-weight:800}.nav-link{color:white;border-radius:12px;padding:12px 14px;margin-bottom:8px;font-weight:600}.nav-link:hover,.nav-link.active{background:rgba(255,255,255,.16);color:white}.sidebar-footer{margin-top:auto;font-size:14px;color:#d9ecff}.logout{color:white;text-decoration:none;font-weight:700}.main{margin-left:280px;width:calc(100% - 280px)}.topbar{height:72px;background:white;border-bottom:1px solid #dce6f3;display:flex;align-items:center;padding:0 28px}.content{padding:30px}.form-card{background:white;border:0;border-radius:22px;box-shadow:0 12px 30px rgba(15,23,42,.08);padding:28px;max-width:950px}.form-control,.form-select{border-radius:12px;padding:12px}.btn-primary{background:#0b5cad;border-color:#0b5cad}@media(max-width:900px){.sidebar{position:relative;width:100%}.layout{display:block}.main{margin-left:0;width:100%}}
    </style>
</head>

<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand"><div class="brand-icon">LMS</div><div><strong>UPQ</strong><br><small>Administración</small></div></div>
        <nav>
            <a class="nav-link" href="{{ url_for('admin.dashboard') }}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
            <a class="nav-link" href="{{ url_for('admin.usuarios', tipo='alumnos') }}"><i class="bi bi-mortarboard me-2"></i>Alumnos</a>
            <a class="nav-link" href="{{ url_for('admin.usuarios', tipo='profesores') }}"><i class="bi bi-person-workspace me-2"></i>Profesores</a>
            <a class="nav-link" href="{{ url_for('admin.materias') }}"><i class="bi bi-journal-bookmark me-2"></i>Materias</a>
            <a class="nav-link" href="{{ url_for('admin.carreras') }}"><i class="bi bi-mortarboard-fill me-2"></i>Carreras</a>
            <a class="nav-link" href="{{ url_for('admin.periodos') }}"><i class="bi bi-calendar3 me-2"></i>Periodos</a>
            <a class="nav-link active" href="{{ url_for('admin.clases') }}"><i class="bi bi-easel2 me-2"></i>Clases</a>
        </nav>
        <div class="sidebar-footer"><p class="mb-1">{{ current_user.nombre_completo }}</p><small>{{ current_user.correo }}</small><br><a class="logout mt-3 d-inline-block" href="{{ url_for('auth.logout') }}"><i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión</a></div>
    </aside>

    <main class="main">
        <header class="topbar"><strong>Clase</strong></header>

        <section class="content">
            <h1 class="fw-bold">Clase</h1>
            <p class="text-muted">Registra o modifica la información de la clase.</p>

            <form method="post" class="form-card">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Materia</label>
                        <select class="form-select" name="materia_id" required>
                            <option value="">Selecciona una materia</option>
                            {% for materia in materias %}
                                <option value="{{ materia.id }}" {% if clase.materia_id == materia.id %}selected{% endif %}>{{ materia.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Periodo académico</label>
                        <select class="form-select" name="periodo_id" required>
                            <option value="">Selecciona un periodo</option>
                            {% for periodo in periodos %}
                                <option value="{{ periodo.id }}" {% if clase.periodo_id == periodo.id %}selected{% endif %}>{{ periodo.nombre }}</option>
                            {% endfor %}
                        </select>
                        <div class="form-text">
                            ¿No aparece el periodo que buscas? <a href="{{ url_for('admin.formulario_periodo') }}">Crea uno nuevo aquí</a>.
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Código de clase</label>
                        <input class="form-control" name="codigo_clase" value="{{ clase.codigo_clase or '' }}" placeholder="Ejemplo: ISC-PW-2026">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Grupo</label>
                        <input class="form-control" name="nombre_grupo" value="{{ clase.nombre_grupo or '' }}" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-bold">Descripción</label>
                        <textarea class="form-control" name="descripcion" rows="4">{{ clase.descripcion or '' }}</textarea>
                    </div>

                    <div class="col-12">
                        <div class="form-check form-switch">
                            <input class="form-check-input" name="activa" type="checkbox" id="activa" {% if clase.activa %}checked{% endif %}>
                            <label class="form-check-label fw-bold" for="activa">Clase activa</label>
                        </div>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button class="btn btn-primary rounded-pill px-4" type="submit"><i class="bi bi-save me-1"></i>Guardar</button>
                    <a class="btn btn-outline-secondary rounded-pill px-4" href="{{ url_for('admin.clases') }}">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
</div>

<script>
    function normalizar(value){
        return value.trim().toUpperCase().replace(/\s+/g,"-").replace(/[^A-Z0-9-]/g,"");
    }

    document.querySelector("[name='codigo_clase']").addEventListener("input", function(){
        this.value = normalizar(this.value);
    });

    document.querySelector("[name='nombre_grupo']").addEventListener("input", function(){
        this.value = normalizar(this.value);
    });
</script>
</body>
</html>
