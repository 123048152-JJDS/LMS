<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bienvenida | LMS UPQ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <style>
        :root {
            --azul-oscuro: #071d37;
            --azul-profundo: #082f68;
            --azul-medio: #0b5cad;
            --azul-claro: #5ec7f7;
            --blanco: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 15% 20%, rgba(144, 224, 255, 0.85), transparent 32%),
                radial-gradient(circle at 85% 25%, rgba(66, 153, 225, 0.80), transparent 36%),
                radial-gradient(circle at 20% 85%, rgba(30, 174, 219, 0.75), transparent 34%),
                linear-gradient(135deg, #dff8ff 0%, #52c7f3 32%, #0b5cad 68%, #08245a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--blanco);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.15), transparent 35%),
                radial-gradient(circle at 70% 80%, rgba(3, 18, 50, 0.35), transparent 45%);
            pointer-events: none;
        }

        .welcome-wrapper {
            position: relative;
            z-index: 2;
            width: min(1100px, 92%);
            min-height: 620px;
            border-radius: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .welcome-content {
            text-align: center;
            animation: fadeUp 1s ease both;
        }

        .welcome-title {
            font-size: clamp(4rem, 10vw, 9rem);
            font-weight: 300;
            letter-spacing: 16px;
            color: white;
            margin: 0 0 42px;
            text-shadow:
                0 8px 28px rgba(4, 20, 50, 0.35),
                0 0 35px rgba(255, 255, 255, 0.22);
            animation: titleReveal 1.25s ease both;
        }

        .role-actions {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            animation: fadeUp 1.3s ease both;
            animation-delay: 0.25s;
        }

        .role-btn {
            min-width: 190px;
            border-radius: 999px;
            padding: 15px 30px;
            font-size: 15px;
            font-weight: 800;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s ease;
            border: 1px solid rgba(255,255,255,0.45);
            backdrop-filter: blur(16px);
            box-shadow: 0 18px 38px rgba(7, 29, 55, 0.22);
        }

        .role-btn.alumno {
            background: rgba(7, 29, 55, 0.92);
            color: white;
        }

        .role-btn.profesor {
            background: rgba(255, 255, 255, 0.28);
            color: white;
        }

        .role-btn:hover {
            transform: translateY(-4px);
            color: white;
            box-shadow: 0 24px 46px rgba(7, 29, 55, 0.32);
        }

        .role-btn.alumno:hover {
            background: rgba(2, 12, 30, 0.96);
        }

        .role-btn.profesor:hover {
            background: rgba(255, 255, 255, 0.38);
        }

        .admin-access {
            position: fixed;
            right: 26px;
            bottom: 26px;
            z-index: 4;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: white;
            text-decoration: none;
            font-size: 19px;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.34);
            backdrop-filter: blur(14px);
            box-shadow: 0 14px 30px rgba(4, 20, 50, 0.25);
            transition: all 0.25s ease;
        }

        .admin-access:hover {
            color: white;
            transform: rotate(35deg) scale(1.08);
            background: rgba(255, 255, 255, 0.28);
        }

        .footer-text {
            position: fixed;
            left: 24px;
            bottom: 24px;
            z-index: 3;
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.72);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(26px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes titleReveal {
            from {
                opacity: 0;
                letter-spacing: 34px;
                filter: blur(10px);
                transform: scale(0.96);
            }

            to {
                opacity: 1;
                letter-spacing: 16px;
                filter: blur(0);
                transform: scale(1);
            }
        }

        @media (max-width: 768px) {
            .welcome-title {
                font-size: 4rem;
                letter-spacing: 8px;
            }

            .role-btn {
                min-width: 100%;
            }

            .welcome-wrapper {
                width: 100%;
                padding: 26px;
            }

            .footer-text {
                font-size: 11px;
                left: 18px;
                bottom: 18px;
            }

            .admin-access {
                right: 18px;
                bottom: 18px;
            }
        }
    </style>
</head>

<body>

    <main class="welcome-wrapper">

        <section class="welcome-content">

            <h1 class="welcome-title">
                Bienvenidos
            </h1>

            <div class="role-actions">

                <a
                    href="{{ url_for('auth.login_tipo', tipo_usuario='alumno') }}"
                    class="role-btn alumno"
                >
                    <i class="bi bi-mortarboard-fill"></i>
                    Alumno
                </a>

                <a
                    href="{{ url_for('auth.login_tipo', tipo_usuario='profesor') }}"
                    class="role-btn profesor"
                >
                    <i class="bi bi-person-workspace"></i>
                    Profesor
                </a>

            </div>

        </section>

    </main>

    <div class="footer-text">
        LMS UPQ · Universidad Politécnica de Querétaro · 2026
    </div>

    <a
        href="{{ url_for('auth.login_tipo', tipo_usuario='administrador') }}"
        class="admin-access"
        title="Acceso administrativo"
        aria-label="Acceso administrativo"
    >
        <i class="bi bi-gear-fill"></i>
    </a>

</body>
</html>
